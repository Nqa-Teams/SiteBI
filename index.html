<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Produções</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 0;
      background-color: #dbeafe;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f172a;
    }

    .container {
      width: 100vw;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background-color: #dbeafe;
      border-radius: 0;
      box-shadow: none;
    }

    .report-wrapper {
      padding: 0;
      height: 100vh;
    }

    .report-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.7);
      border-radius: 0;
      background: #dbeafe;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #dbeafe;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 14px 8px;
      }

      h1 {
        font-size: 21px;
      }

      .report-wrapper {
        height: calc(100vh - 76px);
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="report-wrapper">
      <div class="report-frame">
        <iframe title="Dashboard Produções" src="https://app.powerbi.com/view?r=eyJrIjoiZGRjOGExYWItMTBmMC00ZDU3LWFlMGUtNzNjYzAwZWQ4NjRmIiwidCI6ImQyNjI5ODQyLTU0YzMtNDFlYy1iYWI1LTJhZGVlYmU5MzljMyJ9" allowfullscreen="true" frameborder="0"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
